<body>
<div id="app"></div>

<script>
const CFG = window.CFG || {};
const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const fmt = n => (n || 0).toLocaleString('ru-RU') + ' сум';
const dt = s => s ? new Date(s).toLocaleString('ru-RU') : '';

const CATS = ['Лицо','Тело','Волосы','Загар и SPF','Для мужчин'];
const ST = {
  new:'Новый',
  paid:'Оплачен',
  shipped:'Отправлен',
  done:'Выполнен',
  canceled:'Отменён'
};

const opts = (o,v) => Object.entries(o).map(([k,l]) =>
  `<option value="${esc(k)}"${k==v?' selected':''}>${esc(l)}</option>`
).join('');

let sb = null;
let _cl = [];

function showConfigError(){
  $('app').innerHTML =
    '<p style="padding:30px">Не найдены SUPABASE_URL или SUPABASE_KEY в config.js. Проверь настройки конфигурации.</p>';
}

function showLogin(msg=''){
  $('app').innerHTML = `
    <div id="lg">
      <h2>Luma Beauty — админка</h2>
      <input id="e" type="email" placeholder="E-mail">
      <input id="p" type="password" placeholder="Пароль">
      <button onclick="doLogin()">Войти</button>
      <p style="color:#c0475e">${esc(msg)}</p>
    </div>`;
}

async function doLogin(){
  const {error} = await sb.auth.signInWithPassword({
    email:$('e').value.trim(),
    password:$('p').value
  });
  if(error) return showLogin(error.message);
  await init();
}

async function out(){
  await sb.auth.signOut();
  showLogin();
}

async function init(){
  const {data:{session},error:sessionError} = await sb.auth.getSession();

  if(sessionError) return showLogin(sessionError.message);
  if(!session) return showLogin();

  const {data,error} = await sb
    .from('profiles')
    .select('is_admin')
    .eq('id',session.user.id)
    .single();

  if(error) return showLogin('Не удалось проверить права: ' + error.message);

  if(!data?.is_admin){
    await sb.auth.signOut();
    return showLogin('Нет доступа: этот аккаунт не админ');
  }

  $('app').innerHTML = `
    <header>
      <b>Luma Beauty · админка</b>
      ${[
        ['orders','Заказы'],
        ['products','Товары'],
        ['clients','Клиенты'],
        ['promos','Промокоды'],
        ['banners','Большой пост'],
        ['hero','Главный баннер']
      ].map(([k,l]) =>
        `<button class="g" data-tab="${k}" onclick="go('${k}')">${l}</button>`
      ).join('')}
      <button onclick="out()">Выйти</button>
    </header>
    <main id="m"></main>`;

  go('orders');
}

function go(k){
  document.querySelectorAll('header [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===k));
  $('m').textContent = 'Загрузка…';
  ({
    orders:vOrders,
    products:vProducts,
    clients:vClients,
    promos:vPromos,
    banners:vBanners,
    hero:vHero
  })[k]();
}

async function vOrders(){
  const {data,error} = await sb
    .from('orders')
    .select('*')
    .order('id',{ascending:false})
    .limit(300);

  if(error) return $('m').textContent = error.message;
  _orders = data || [];
  const newCount = _orders.filter(o=>o.status==='new').length;
  const paidCount = _orders.filter(o=>o.status==='paid').length;
  const sumTotal = _orders.filter(o=>o.status!=='canceled').reduce((n,o)=>n+Number(o.total||0),0);

  $('m').innerHTML = `
    <h3>Заказы <span style="font:500 13px Jost;color:var(--adm-muted)">Последние ${data.length}</span></h3>
    <div class="admin-stats">
      <div class="admin-stat"><small>Всего заказов</small><b>${data.length}</b></div>
      <div class="admin-stat"><small>Новые</small><b>${newCount}</b></div>
      <div class="admin-stat"><small>Оплачены</small><b>${paidCount}</b></div>
      <div class="admin-stat"><small>Сумма неотменённых</small><b style="font-size:20px">${fmt(sumTotal)}</b></div>
    </div>
    <div class="order-tools">
      <input id="orderSearch" placeholder="Поиск: номер, имя, телефон, адрес…" oninput="filterOrderRows()">
      <select id="orderStatusFilter" onchange="filterOrderRows()"><option value="">Все статусы</option>${opts(ST,'')}</select>
      <button class="g" onclick="vOrders()">Обновить</button>
    </div>
    <table id="ordersTable">
      <tr>
        <th>№</th><th>Дата</th><th>Клиент</th>
        <th>Адрес доставки</th><th>Товары</th>
        <th>Сумма</th><th>Оплата</th><th>Статус</th>
      </tr>
      ${data.map(o => `
        <tr data-status="${esc(o.status)}" data-search="${esc([o.id,o.customer_name,o.phone,o.address,o.payment].join(' ').toLowerCase())}">
          <td><b>#${esc(o.id)}</b></td>
          <td>${dt(o.created_at)}</td>
          <td>${esc(o.customer_name)}<br>${esc(o.phone)}</td>
          <td>${esc(o.address)
            .replace(/https:\/\/[^\s<]+/g,u =>
              `<a href="${u}" target="_blank" rel="noopener">карта</a>`
            )
            .replace(/\n/g,'<br>')}
          </td>
          <td>${(o.items||[]).map(i =>
            esc(i.title)+' × '+esc(i.qty)
          ).join('<br>')}</td>
          <td><b>${fmt(o.total)}</b>
            ${o.promo ? '<br>'+esc(o.promo)+' −'+esc(o.discount)+'%' : ''}
          </td>
          <td>${esc(o.payment)}</td>
          <td>
            <select class="status-select status-${esc(o.status)}" onchange="setSt(${JSON.stringify(o.id)},this)">
              ${opts(ST,o.status)}
            </select>
          </td>
        </tr>
      `).join('')}
    </table>`;
  filterOrderRows();
}

let _orders = [];
function filterOrderRows(){
  const q = ($('orderSearch')?.value || '').trim().toLowerCase();
  const status = $('orderStatusFilter')?.value || '';
  document.querySelectorAll('#ordersTable tr[data-status]').forEach(row=>{
    row.style.display = (!q || (row.dataset.search||'').includes(q)) && (!status || row.dataset.status===status) ? '' : 'none';
  });
}

async function setSt(id,el){
  const s = el.value;
  const {error} = await sb
    .from('orders')
    .update({status:s})
    .eq('id',id);

  if(error){
    alert('Ошибка изменения статуса: '+error.message);
    return;
  }

  el.className = 'status-select status-'+s;
  const row = el.closest('tr');
  if(row) row.dataset.status = s;
  filterOrderRows();
}

async function vProducts(){
  const {data,error} = await sb
    .from('products')
    .select('*')
    .order('id');

  if(error) return $('m').textContent = error.message;

  $('m').innerHTML = `
    <h3>
      Товары (${data.length})
      <button onclick="addP()">+ Новый</button>
      <input placeholder="Поиск" oninput="filt(this.value)">
    </h3>
    <table>
      <tr>
        <th>Фото</th><th>Название</th><th>Тип / бренд</th>
        <th>Категория</th><th>Объём</th><th>Состав</th>
        <th>Подходит</th><th>Не подходит</th>
        <th>Цена, сум</th><th>Скидка, %</th><th>Виден</th><th></th>
      </tr>
      ${data.map(p => `
        <tr id="r${esc(p.id)}"
            data-q="${esc((p.title+' '+(p.kind||'')).toLowerCase())}">
          <td>
            ${[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).length ? `<div class="photo-stack">${[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>` : ''}
            <br>
            <input type="file" accept="image/*"
              multiple onchange="upGallery(${JSON.stringify(p.id)},this)"
              style="width:150px">
            <span class="photo-help">${[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).length} / 5 фото · можно выбрать несколько</span>
          </td>
          <td><input type="text" name="title" value="${esc(p.title)}"></td>
          <td><input type="text" name="kind" value="${esc(p.kind)}"></td>
          <td>
            <select name="category">
              ${opts(Object.fromEntries(CATS.map(c=>[c,c])),p.category)}
            </select>
          </td>
          <td><input type="text" name="volume" value="${esc(p.volume)}" style="width:70px"></td>
          <td><textarea name="ingredients" rows="3">${esc(p.ingredients)}</textarea></td>
          <td><textarea name="suits" rows="3">${esc(p.suits)}</textarea></td>
          <td><textarea name="avoid" rows="3">${esc(p.avoid)}</textarea></td>
          <td><input type="number" name="price" value="${esc(p.price)}" style="width:100px"></td><td><input type="number" name="discount_percent" min="0" max="100" step="1" value="${esc(p.discount_percent||0)}" style="width:70px"></td>
          <td><input type="checkbox" name="active"${p.active?' checked':''}></td>
          <td><button onclick="saveP(${JSON.stringify(p.id)},this)">Сохранить</button></td>
        </tr>
      `).join('')}
    </table>`;
}

function filt(q){
  q = q.toLowerCase();
  document.querySelectorAll('tr[data-q]').forEach(r => {
    r.style.display = r.dataset.q.includes(q) ? '' : 'none';
  });
}

/* Сохранение товара с проверкой ответа базы */
async function saveP(id,button){
  const r = $('r'+id);
  if(!r) return alert('Не найдена строка товара. Обнови список товаров.');

  const g = n => r.querySelector('[name="'+n+'"]');
  const title = g('title').value.trim();

  if(!title) return alert('Название товара не может быть пустым.');
  const discountPercent = Number(g('discount_percent').value);
  if(!Number.isInteger(discountPercent) || discountPercent < 0 || discountPercent > 100) return alert('Скидка должна быть целым числом от 0 до 100.');

  const changes = {
    title,
    kind:g('kind').value.trim(),
    category:g('category').value,
    volume:g('volume').value.trim(),
    ingredients:g('ingredients').value,
    suits:g('suits').value,
    avoid:g('avoid').value,
    price:Number(g('price').value)||0,
    discount_percent:discountPercent,
    active:g('active').checked
  };

  if(button) button.disabled = true;

  try{
    const {data,error} = await sb
      .from('products')
      .update(changes)
      .eq('id',id)
      .select('id,title');

    if(error){
      alert('Ошибка сохранения: '+error.message);
      return;
    }

    if(!data || data.length===0){
      alert(
        'База не подтвердила изменение. '+
        'Возможны ограничения доступа (RLS) или неверный ID товара. '+
        'Название не считаем сохранённым.'
      );
      return;
    }

    const saved = data[0];

    if(saved.title !== title){
      alert('База вернула другое название. Проверь товар в базе данных.');
      return;
    }

    alert('Название сохранено в базе: '+saved.title);
    await vProducts();

  }catch(e){
    alert('Не удалось сохранить товар: '+(e.message||e));
  }finally{
    if(button) button.disabled = false;
  }
}

async function upGallery(id,el){
  const files = Array.from(el.files || []);
  if(!files.length) return;
  if(files.some(f => !f.type.startsWith('image/'))) return alert('Выбери только изображения.');

  try{
    const {data:row,error:readError} = await sb.from('products')
      .select('image,gallery').eq('id',id).single();
    if(readError) return alert('Не удалось прочитать товар: '+readError.message);

    let main = row.image || '';
    let gallery = Array.isArray(row.gallery) ? [...row.gallery] : [];

    for(const file of files){
      if(main && gallery.length >= 4){
        alert('Максимум 5 фотографий на один товар. Остальные файлы пропущены.');
        break;
      }
      const safeName = file.name.replace(/[^\w.-]/g,'_');
      const path = Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+safeName;
      const {error:uploadError} = await sb.storage.from('products').upload(path,file);
      if(uploadError) throw uploadError;
      const url = sb.storage.from('products').getPublicUrl(path).data.publicUrl;
      if(!main) main = url;
      else gallery.push(url);
    }

    const {data,error} = await sb.from('products')
      .update({image:main,gallery}).eq('id',id).select('id,image,gallery');
    if(error) return alert('Фото загружены, но не удалось сохранить их в товаре: '+error.message);
    if(!data || !data.length) return alert('База не подтвердила сохранение фотографий.');

    alert('Фотографии сохранены. Первое фото используется как главное.');
    await vProducts();
  }catch(e){
    alert('Ошибка загрузки фото: '+(e.message||e));
  }
}
async function addP(){
  const {error} = await sb.from('products').insert({
    title:'Новый товар',
    category:'Тело',
    price:0,
    discount_percent:0
  });

  if(error) return alert('Не удалось добавить товар: '+error.message);
  await vProducts();
}

async function vClients(){
  const {data,error} = await sb
    .from('profiles')
    .select('*')
    .order('created_at',{ascending:false});

  if(error) return $('m').textContent = error.message;
  _cl = data || [];

  const {data:orders,error:ordersError} = await sb
    .from('orders')
    .select('user_id,total,status')
    .in('status',['paid','shipped','done']);

  if(ordersError) return $('m').textContent = 'Не удалось загрузить покупки клиентов: '+ordersError.message;

  const purchaseStats = {};
  (orders||[]).forEach(o=>{
    if(!o.user_id) return;
    if(!purchaseStats[o.user_id]) purchaseStats[o.user_id]={count:0,total:0};
    purchaseStats[o.user_id].count++;
    purchaseStats[o.user_id].total += Number(o.total||0);
  });

  $('m').innerHTML = `
    <h3>Клиенты (${_cl.length}) <button onclick="csv()">Скачать CSV</button></h3>
    <div class="order-tools">
      <input id="clientSearch" placeholder="Поиск по имени или номеру телефона…" oninput="filterClients()">
      <label>С даты <input id="clientDateFrom" type="date" aria-label="С даты регистрации" onchange="filterClients()"></label>
      <label>По дату <input id="clientDateTo" type="date" aria-label="По дату регистрации" onchange="filterClients()"></label>
      <button class="g" onclick="clearClientFilters()">Сбросить</button>
      <button class="g" onclick="vClients()">Обновить</button>
    </div>
    <table id="clientsTable">
      <tr><th>Имя</th><th>Телефон</th><th>Покупок</th><th>Сумма покупок</th><th>Баланс кешбэка</th><th>Кешбэк, %</th><th>E-mail</th><th>Регистрация</th></tr>
      ${_cl.map(c => {
        const stats = purchaseStats[c.id] || {count:0,total:0};
        return `
        <tr data-search="${esc([c.name,c.phone].join(' ').toLowerCase())}" data-created="${c.created_at ? new Date(c.created_at).getTime() : ''}">
          <td>${esc(c.name)}${c.is_admin?' (админ)':''}</td>
          <td>${esc(c.phone)}</td>
          <td><b>${stats.count}</b></td>
          <td>${fmt(stats.total)}</td>
          <td><b>${fmt(c.cashback_balance||0)}</b></td>
          <td>
            <div style="display:flex;gap:6px;align-items:center;min-width:130px">
              <input class="cashback-rate" type="number" min="0" max="100" step="0.1" value="${Number(c.cashback_percent??1)}" aria-label="Процент кешбэка для ${esc(c.name)}" style="width:75px">
              <button class="g" onclick="saveCashbackRate(${JSON.stringify(c.id)},this.previousElementSibling)">Сохранить</button>
            </div>
          </td>
          <td>${esc(c.email)}</td>
          <td>${dt(c.created_at)}</td>
        </tr>
        `;
      }).join('')}
    </table>`;
}

async function saveCashbackRate(userId,input){
  const percent=Number(input.value);
  if(!Number.isFinite(percent)||percent<0||percent>100){
    alert('Укажи процент от 0 до 100.');
    return;
  }
  const button=input.nextElementSibling;
  button.disabled=true;
  const {error}=await sb.rpc('admin_set_cashback_percent',{
    p_user_id:userId,
    p_percent:percent
  });
  button.disabled=false;
  if(error){
    alert('Не удалось сохранить процент кешбэка: '+error.message);
    return;
  }
  input.value=percent.toFixed(2).replace(/0+$/,'').replace(/\\.$/,'');
  alert('Процент кешбэка сохранён.');
}

function filterClients(){
  const q = ($('clientSearch')?.value || '').trim().toLowerCase();
  const fromValue = $('clientDateFrom')?.value || '';
  const toValue = $('clientDateTo')?.value || '';
  const from = fromValue ? new Date(fromValue+'T00:00:00').getTime() : null;
  const to = toValue ? new Date(toValue+'T23:59:59.999').getTime() : null;
  document.querySelectorAll('#clientsTable tr[data-search]').forEach(row=>{
    const created = Number(row.dataset.created);
    const matchesSearch = (row.dataset.search||'').includes(q);
    const matchesFrom = from === null || (Number.isFinite(created) && created >= from);
    const matchesTo = to === null || (Number.isFinite(created) && created <= to);
    row.style.display = matchesSearch && matchesFrom && matchesTo ? '' : 'none';
  });
}

function clearClientFilters(){
  if($('clientSearch')) $('clientSearch').value='';
  if($('clientDateFrom')) $('clientDateFrom').value='';
  if($('clientDateTo')) $('clientDateTo').value='';
  filterClients();
}

function csv(){
  const rows = [
    ['Имя','Телефон','E-mail','Дата'],
    ..._cl.map(c=>[c.name,c.phone,c.email,c.created_at])
  ];

  const content = rows.map(row =>
    row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')
  ).join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(
    new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'})
  );
  a.download = 'clients.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}


async function vHero(){
 const {data,error}=await sb.from('home_hero').select('*').eq('id',1).maybeSingle();
 if(error)return $('m').innerHTML='<h3>Главный баннер</h3><p>Сначала выполни SQL-файл sql/5_home_hero.sql в Supabase.</p><pre>'+esc(error.message)+'</pre>';
 const photos=Array.isArray(data?.photos)?data.photos:[];
 const defaults=['https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=2000&q=88','https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=2000&q=88','https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=2000&q=88','https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=2000&q=88','https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=2000&q=88'];
 const shown=photos.length?photos:defaults;
 $('m').innerHTML='<h3>Главный баннер</h3><p>Сейчас на сайте используются эти 5 фотографий. Они останутся без изменений, пока ты не загрузишь новые.</p><div class="photo-stack">'+shown.map((u,i)=>'<div style="display:inline-block;text-align:center"><img src="'+esc(u)+'" style="width:150px;height:90px;object-fit:cover;border-radius:10px"><br><small>Фото '+(i+1)+'</small></div>').join('')+'</div><p><b>Заменить фотографии</b> (выбери до 5 изображений; новая подборка заменит текущую)</p><input id="heroFiles" type="file" accept="image/*" multiple><p><button onclick="uploadHeroPhotos()">Загрузить новые фотографии</button> <button class="g" onclick="resetHeroPhotos()">Вернуть исходные фотографии</button></p><p class="photo-help">Фотографии автоматически меняются каждые 5 секунд. Можно загрузить от 1 до 5 изображений.</p>';
}
async function uploadHeroPhotos(){
 const files=Array.from($('heroFiles').files||[]);
 if(!files.length)return alert('Сначала выбери фотографии.');
 if(files.length>5)return alert('Можно загрузить максимум 5 фотографий.');
 if(files.some(f=>!f.type.startsWith('image/')))return alert('Выбери только изображения.');
 try{
  const urls=[];
  for(const file of files){
   const safe=file.name.replace(/[^\\w.-]/g,'_');
   const path='home-hero/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+safe;
   const {error}=await sb.storage.from('products').upload(path,file);
   if(error)throw error;
   urls.push(sb.storage.from('products').getPublicUrl(path).data.publicUrl);
  }
  const {error}=await sb.from('home_hero').upsert({id:1,photos:urls},{onConflict:'id'});
  if(error)throw error;
  alert('Фотографии главного баннера обновлены!');
  await vHero();
 }catch(e){alert('Ошибка загрузки: '+(e.message||e));}
}
async function resetHeroPhotos(){
 if(!confirm('Вернуть исходные 5 фотографий баннера?'))return;
 const {error}=await sb.from('home_hero').delete().eq('id',1);
 if(error)return alert('Не удалось сбросить: '+error.message);
 alert('Исходные фотографии восстановлены.');
 await vHero();
}

async function vPromos(){
  const {data,error} = await sb
    .from('promos')
    .select('*')
    .order('code');

  if(error) return $('m').textContent = error.message;

  $('m').innerHTML = `
    <h3>Промокоды</h3>
    <table>
      <tr><th>Код</th><th>Скидка, %</th><th>Активен</th><th></th></tr>
      ${(data||[]).map(c=>`
        <tr data-c="${esc(c.code)}">
          <td><b>${esc(c.code)}</b></td>
          <td><input type="number" name="percent" value="${esc(c.percent)}" style="width:70px"></td>
          <td><input type="checkbox" name="active"${c.active?' checked':''}></td>
          <td>
            <button onclick="savePr(this)">Сохранить</button>
            <button class="g" onclick="delPr(this)">Удалить</button>
          </td>
        </tr>
      `).join('')}
    </table>
    <h4>Новый промокод</h4>
    <input id="nc" placeholder="КОД">
    <input id="np" type="number" placeholder="%" style="width:70px">
    <button onclick="addPr()">Добавить</button>`;
}

async function savePr(b){
  const tr = b.closest('tr');
  const {error} = await sb.from('promos').update({
    percent:Number(tr.querySelector('[name=percent]').value),
    active:tr.querySelector('[name=active]').checked
  }).eq('code',tr.dataset.c);

  if(error) alert('Ошибка: '+error.message);
  else alert('Запрос выполнен. Проверь результат обновлением списка.');
}

async function delPr(b){
  if(!confirm('Удалить промокод?')) return;

  const {error} = await sb.from('promos')
    .delete()
    .eq('code',b.closest('tr').dataset.c);

  if(error) alert(error.message);
  else await vPromos();
}

async function addPr(){
  const code = $('nc').value.trim().toUpperCase();
  const percent = Number($('np').value);

  if(!code) return alert('Введи код промокода.');
  if(!Number.isFinite(percent) || percent<0 || percent>100){
    return alert('Укажи скидку от 0 до 100%.');
  }

  const {error} = await sb.from('promos').insert({code,percent});

  if(error) alert(error.message);
  else await vPromos();
}

if(!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY){
  showConfigError();
}else if(!window.supabase){
  $('app').textContent = 'Не удалось загрузить библиотеку Supabase. Обнови страницу.';
}else{
  sb = window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
  init();
}
