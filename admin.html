@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600;700&display=swap');
:root{--adm-bg:#f7f3eb;--adm-card:#fffdf9;--adm-ink:#30271e;--adm-muted:#8b7b69;--adm-gold:#b58a50;--adm-gold-dark:#8e6835;--adm-line:#e9dfcf;--adm-shadow:0 12px 34px rgba(75,54,29,.07)}
*{box-sizing:border-box}
body{font:14px Jost,system-ui,sans-serif;background:var(--adm-bg);color:var(--adm-ink);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(48,39,30,.97);backdrop-filter:blur(12px);padding:13px clamp(14px,3vw,34px);gap:8px;box-shadow:0 8px 24px #30271e18}

main{padding:clamp(14px,3vw,34px);max-width:1600px;margin:auto;overflow-x:auto}
h2,h3{font-family:'Cormorant Garamond',serif;color:var(--adm-ink)}
h3{font-size:28px;margin:4px 0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h4{font-size:17px;margin:24px 0 10px}
button{font:600 13px Jost,system-ui,sans-serif;background:var(--adm-gold);color:#fff;border:1px solid var(--adm-gold);border-radius:9px;padding:9px 15px;cursor:pointer;transition:transform .15s,background .15s}

<body>
<div id="app"></div>

<script>
const CFG = window.CFG || {};
const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const fmt = n => (n || 0).toLocaleString('ru-RU') + ' сум';
const dt = s => s ? new Date(s).toLocaleString('ru-RU') : '';

const CATS = ['Лицо','Тело','Волосы','Загар и SPF','Для мужчин'];
const ST = {
  new:'Новый',
  paid:'Оплачен',
  shipped:'Отправлен',
  done:'Выполнен',
  canceled:'Отменён'
};

const opts = (o,v) => Object.entries(o).map(([k,l]) =>
  `<option value="${esc(k)}"${k==v?' selected':''}>${esc(l)}</option>`
).join('');

let sb = null;
let _cl = [];

function showConfigError(){
  $('app').innerHTML =
    '<p style="padding:30px">Не найдены SUPABASE_URL или SUPABASE_KEY в config.js. Проверь настройки конфигурации.</p>';
}

function showLogin(msg=''){
  $('app').innerHTML = `
    <div id="lg">
      <h2>Luma Beauty — админка</h2>
      <input id="e" type="email" placeholder="E-mail">
      <input id="p" type="password" placeholder="Пароль">
      <button onclick="doLogin()">Войти</button>
      <p style="color:#c0475e">${esc(msg)}</p>
    </div>`;
}

async function doLogin(){
  const {error} = await sb.auth.signInWithPassword({
    email:$('e').value.trim(),
    password:$('p').value
  });
  if(error) return showLogin(error.message);
  await init();
}

async function out(){
  await sb.auth.signOut();
  showLogin();
}

async function init(){
  const {data:{session},error:sessionError} = await sb.auth.getSession();

  if(sessionError) return showLogin(sessionError.message);
  if(!session) return showLogin();

  const {data,error} = await sb
    .from('profiles')
    .select('is_admin')
    .eq('id',session.user.id)
    .single();

  if(error) return showLogin('Не удалось проверить права: ' + error.message);

  if(!data?.is_admin){
    await sb.auth.signOut();
    return showLogin('Нет доступа: этот аккаунт не админ');
  }

  $('app').innerHTML = `
    <header>
      <b>Luma Beauty · админка</b>
      ${[
        ['analytics','Главная'],
        ['orders','Заказы'],
        ['orderControl','Контроль заказов'],
        ['products','Товары'],
        ['smartStock','Умный склад'],
        ['clients','Клиенты'],
        ['smartClients','Умные клиенты'],
        ['cashback','Кешбэк / VIP'],
        ['promos','Промокоды'],
        ['hero','Главный баннер'],
        ['banners','Большой пост'],
        ['audit','История действий']
      ].map(([k,l]) =>
        `<button class="g" data-tab="${k}" onclick="go('${k}')">${l}</button>`
      ).join('')}
      <button onclick="out()">Выйти</button>
    </header>
    <main id="m"></main>`;

  go('orders');
}

function go(k){
  document.querySelectorAll('header [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===k));
  $('m').textContent = 'Загрузка…';
  ({
    analytics:vAnalytics,
    smartClients:vSmartClients,
    smartStock:vSmartStock,
    orderControl:vOrderControl,
    orders:vOrders,
    products:vProducts,
    clients:vClients,
    cashback:vCashback,
    promos:vPromos,
    banners:vBanners,
    hero:vHero,
    audit:vAudit
  })[k]();
}

async function vOrders(){
  const {data,error} = await sb
    .from('orders')
    .select('*')
    .order('id',{ascending:false})
    .limit(300);

  if(error) return $('m').textContent = error.message;
  _orders = data || [];
  const newCount = _orders.filter(o=>o.status==='new').length;
  const paidCount = _orders.filter(o=>o.status==='paid').length;
  const sumTotal = _orders.filter(o=>o.status!=='canceled').reduce((n,o)=>n+Number(o.total||0),0);

  $('m').innerHTML = `
    <h3>Заказы <span style="font:500 13px Jost;color:var(--adm-muted)">Последние ${data.length}</span> <button class="g" onclick="exportOrders()">Excel / CSV</button> <button class="g" onclick="backupData()">Резервная копия</button></h3>
    <div class="admin-stats">
      <div class="admin-stat"><small>Всего заказов</small><b>${data.length}</b></div>
      <div class="admin-stat"><small>Новые</small><b>${newCount}</b></div>
      <div class="admin-stat"><small>Оплачены</small><b>${paidCount}</b></div>
      <div class="admin-stat"><small>Сумма неотменённых</small><b style="font-size:20px">${fmt(sumTotal)}</b></div>
    </div>
    <div class="order-tools">
      <input id="orderSearch" placeholder="Поиск: номер, имя, телефон, адрес…" oninput="filterOrderRows()">
      <select id="orderStatusFilter" onchange="filterOrderRows()"><option value="">Все статусы</option>${opts(ST,'')}</select>
      <button class="g" onclick="vOrders()">Обновить</button>
    </div>
    <table id="ordersTable">
      <tr>
        <th>№</th><th>Дата</th><th>Клиент</th>
        <th>Адрес доставки</th><th>Товары</th>
        <th>Сумма</th><th>Оплата</th><th>Статус</th><th>Чек</th>
      </tr>
      ${data.map(o => `
        <tr data-status="${esc(o.status)}" data-search="${esc([o.id,o.customer_name,o.phone,o.address,o.payment].join(' ').toLowerCase())}">
          <td><b>#${esc(o.id)}</b></td>
          <td>${dt(o.created_at)}</td>
          <td>${esc(o.customer_name)}<br>${esc(o.phone)}</td>
          <td>${esc(o.address)
            .replace(/https:\/\/[^\s<]+/g,u =>
              `<a href="${u}" target="_blank" rel="noopener">карта</a>`
            )
            .replace(/\n/g,'<br>')}
          </td>
          <td>${(o.items||[]).map(i =>
            esc(i.title)+' × '+esc(i.qty)
          ).join('<br>')}</td>
          <td><b>${fmt(o.total)}</b>
            ${o.promo ? '<br>'+esc(o.promo)+' −'+esc(o.discount)+'%' : ''}
          </td>
          <td>${esc(o.payment)}</td>
          <td>
            <select class="status-select status-${esc(o.status)}" onchange="setSt(${JSON.stringify(o.id)},this)">
              ${opts(ST,o.status)}
            </select>
          </td>
          <td><button class="g" onclick="printOrder(${JSON.stringify(o.id)})">Печать</button></td>
        </tr>
      `).join('')}
    </table>`;
  filterOrderRows();
}

let _orders = [];
function filterOrderRows(){
  const q = ($('orderSearch')?.value || '').trim().toLowerCase();
  const status = $('orderStatusFilter')?.value || '';
  document.querySelectorAll('#ordersTable tr[data-status]').forEach(row=>{
    row.style.display = (!q || (row.dataset.search||'').includes(q)) && (!status || row.dataset.status===status) ? '' : 'none';
  });
}

async function setSt(id,el){
  const s = el.value;
  const {error} = await sb
    .from('orders')
    .update({status:s})
    .eq('id',id);

  if(error){
    alert('Ошибка изменения статуса: '+error.message);
    return;
  }

  el.className = 'status-select status-'+s;
  const row = el.closest('tr');
  if(row) row.dataset.status = s;
  filterOrderRows();
}

async function vProducts(){
  const {data,error} = await sb
    .from('products')
    .select('*')
    .order('id');

  if(error) return $('m').textContent = error.message;

  $('m').innerHTML = `
    <h3>
      Товары (${data.length})
      <button onclick="addP()">+ Новый</button>
      <input placeholder="Поиск" oninput="filt(this.value)">
    </h3>
    <table>
      <tr>
        <th>Фото</th><th>Название</th><th>Тип / бренд</th>
        <th>Категория</th><th>Объём</th><th>Состав</th>
        <th>Подходит</th><th>Не подходит</th>
        <th>Цена, сум</th><th>Скидка, %</th><th>Остаток</th><th>Виден</th><th></th>
      </tr>
      ${data.map(p => `
        <tr id="r${esc(p.id)}"
            data-q="${esc((p.title+' '+(p.kind||'')).toLowerCase())}">
          <td>
            ${[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).length ? `<div class="photo-stack">${[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>` : ''}
            <br>
            <input type="file" accept="image/*"
              multiple onchange="upGallery(${JSON.stringify(p.id)},this)"
              style="width:150px">
            <span class="photo-help">${[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).length} / 5 фото · можно выбрать несколько</span>
          </td>
          <td><input type="text" name="title" value="${esc(p.title)}"></td>
          <td><input type="text" name="kind" value="${esc(p.kind)}"></td>
          <td>
            <select name="category">
              ${opts(Object.fromEntries(CATS.map(c=>[c,c])),p.category)}
            </select>
          </td>
          <td><input type="text" name="volume" value="${esc(p.volume)}" style="width:70px"></td>
          <td><textarea name="ingredients" rows="3">${esc(p.ingredients)}</textarea></td>
          <td><textarea name="suits" rows="3">${esc(p.suits)}</textarea></td>
          <td><textarea name="avoid" rows="3">${esc(p.avoid)}</textarea></td>
          <td><input type="number" name="price" value="${esc(p.price)}" style="width:100px"></td><td><input type="number" name="discount_percent" min="0" max="100" step="1" value="${esc(p.discount_percent||0)}" style="width:70px"></td>
          <td><input type="number" name="stock" min="0" step="1" placeholder="—" value="${p.stock===null||p.stock===undefined?'':esc(p.stock)}" style="width:75px" title="Пусто — учёт остатков выключен"></td>
          <td><input type="checkbox" name="active"${p.active?' checked':''}></td>
          <td><button onclick="saveP(${JSON.stringify(p.id)},this)">Сохранить</button></td>
        </tr>
      `).join('')}
    </table>`;
}


async function vAnalytics(){
  const [{data:orders,error:oe},{data:products,error:pe},{data:profiles,error:ce}] = await Promise.all([
    sb.from('orders').select('id,user_id,phone,total,status,created_at,items,promo,discount,cashback_used'),
    sb.from('products').select('id,title,stock,active'),
    sb.from('profiles').select('id,created_at')
  ]);
  if(oe||pe||ce)return $('m').textContent='Не удалось загрузить аналитику: '+(oe||pe||ce).message;
  const all=orders||[], paid=all.filter(o=>['paid','shipped','done'].includes(o.status));
  const revenue=paid.reduce((n,o)=>n+Number(o.total||0)+Number(o.cashback_used||0),0);
  const avg=paid.length?Math.round(revenue/paid.length):0;
  const now=new Date(), monthStart=new Date(now.getFullYear(),now.getMonth(),1), weekStart=new Date(now);weekStart.setDate(now.getDate()-6);weekStart.setHours(0,0,0,0);
  const monthOrders=paid.filter(o=>new Date(o.created_at)>=monthStart);
  const monthRevenue=monthOrders.reduce((n,o)=>n+Number(o.total||0)+Number(o.cashback_used||0),0);
  const weekOrders=paid.filter(o=>new Date(o.created_at)>=weekStart);
  const newClients=(profiles||[]).filter(p=>p.created_at&&new Date(p.created_at)>=monthStart).length;
  const dayMap={};for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dayMap[d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})]=0;}
  paid.forEach(o=>{const d=new Date(o.created_at),key=d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});if(key in dayMap)dayMap[key]+=Number(o.total||0)+Number(o.cashback_used||0);});
  const max=Math.max(1,...Object.values(dayMap));

  const discountPercent = Number(g('discount_percent').value);
  if(!Number.isInteger(discountPercent) || discountPercent < 0 || discountPercent > 100) return alert('Скидка должна быть целым числом от 0 до 100.');

  const changes = {
    title,
    kind:g('kind').value.trim(),
    category:g('category').value,
    volume:g('volume').value.trim(),
    ingredients:g('ingredients').value,
    suits:g('suits').value,
    avoid:g('avoid').value,
    price:Number(g('price').value)||0,
    discount_percent:discountPercent,
    stock:g('stock').value.trim()===''?null:Number(g('stock').value),
    active:g('active').checked
  };

  if(button) button.disabled = true;

  try{
    const {data,error} = await sb
      .from('products')
      .update(changes)
      .eq('id',id)
      .select('id,title');

    if(error){
      alert('Ошибка сохранения: '+error.message);
      return;
    }

    if(!data || data.length===0){
      alert(
        'База не подтвердила изменение. '+
        'Возможны ограничения доступа (RLS) или неверный ID товара. '+
        'Название не считаем сохранённым.'
      );
      return;
    }

    const saved = data[0];

    if(saved.title !== title){
      alert('База вернула другое название. Проверь товар в базе данных.');
      return;
    }

    alert('Название сохранено в базе: '+saved.title);
    await vProducts();

  }catch(e){
    alert('Не удалось сохранить товар: '+(e.message||e));
  }finally{
    if(button) button.disabled = false;
  }
}

async function upGallery(id,el){
  const files = Array.from(el.files || []);
  if(!files.length) return;
  if(files.some(f => !f.type.startsWith('image/'))) return alert('Выбери только изображения.');

  try{
    const {data:row,error:readError} = await sb.from('products')
      .select('image,gallery').eq('id',id).single();
    if(readError) return alert('Не удалось прочитать товар: '+readError.message);

    let main = row.image || '';
    let gallery = Array.isArray(row.gallery) ? [...row.gallery] : [];

    for(const file of files){
      if(main && gallery.length >= 4){
        alert('Максимум 5 фотографий на один товар. Остальные файлы пропущены.');
        break;
      }
      const safeName = file.name.replace(/[^\w.-]/g,'_');
      const path = Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+safeName;
      const {error:uploadError} = await sb.storage.from('products').upload(path,file);
      if(uploadError) throw uploadError;
      const url = sb.storage.from('products').getPublicUrl(path).data.publicUrl;
      if(!main) main = url;
      else gallery.push(url);
    }

    const {data,error} = await sb.from('products')
      .update({image:main,gallery}).eq('id',id).select('id,image,gallery');
    if(error) return alert('Фото загружены, но не удалось сохранить их в товаре: '+error.message);
    if(!data || !data.length) return alert('База не подтвердила сохранение фотографий.');

    alert('Фотографии сохранены. Первое фото используется как главное.');
    await vProducts();
  }catch(e){
    alert('Ошибка загрузки фото: '+(e.message||e));
  }
}

async function adjustClientCashback(userId){
  const raw=prompt('Сумма в сумах: положительное число — начислить, отрицательное — списать:');

  if(!/^-?\d+$/.test(raw.trim())||Number(raw)===0||!Number.isSafeInteger(Number(raw)))return alert('Введи целое ненулевое число.');
  const reason=prompt('Причина корректировки (обязательно):');
  if(reason===null)return;
  if(reason.trim().length<3)return alert('Причина должна содержать минимум 3 символа.');
  const {error}=await sb.rpc('admin_adjust_cashback',{p_user_id:userId,p_amount:Number(raw),p_reason:reason.trim()});

  alert('Баланс обновлён, операция записана в историю.');await vCashback();
}

async function saveCashbackRate(userId,input){
  const percent=Number(input.value);
  if(!Number.isFinite(percent)||percent<0||percent>100){
    alert('Укажи процент от 0 до 100.');
    return;
  }
  const button=input.nextElementSibling;
  button.disabled=true;
  const {error}=await sb.rpc('admin_set_cashback_percent',{
    p_user_id:userId,
    p_percent:percent
  });
  button.disabled=false;
  if(error){
    alert('Не удалось сохранить процент кешбэка: '+error.message);
    return;
  }
  input.value=percent.toFixed(2).replace(/0+$/,'').replace(/\\.$/,'');
  alert('Процент кешбэка сохранён.');
}

function filterClients(){
  const q = ($('clientSearch')?.value || '').trim().toLowerCase();
  const fromValue = $('clientDateFrom')?.value || '';
  const toValue = $('clientDateTo')?.value || '';
  const purchaseFilter = $('clientPurchaseFilter')?.value || '';
  const from = fromValue ? new Date(fromValue+'T00:00:00').getTime() : null;
  const to = toValue ? new Date(toValue+'T23:59:59.999').getTime() : null;
  document.querySelectorAll('#clientsTable tr[data-search]').forEach(row=>{
    const created = Number(row.dataset.created);
    const matchesSearch = (row.dataset.search||'').includes(q);
    const purchases = Number(row.dataset.purchases || 0);
    const matchesPurchase = !purchaseFilter ||
      (purchaseFilter === 'buyers' && purchases >= 1) ||
      (purchaseFilter === 'registered' && purchases === 0);
    const matchesFrom = from === null || (Number.isFinite(created) && created >= from);
    const matchesTo = to === null || (Number.isFinite(created) && created <= to);
    row.style.display = matchesSearch && matchesPurchase && matchesFrom && matchesTo ? '' : 'none';
  });
}

function clearClientFilters(){
  if($('clientSearch')) $('clientSearch').value='';
  if($('clientPurchaseFilter')) $('clientPurchaseFilter').value='';
  if($('clientDateFrom')) $('clientDateFrom').value='';
  if($('clientDateTo')) $('clientDateTo').value='';
  filterClients();
}

function csv(){
  const rows = [
    ['Имя','Телефон','E-mail','Дата'],
    ..._cl.map(c=>[c.name,c.phone,c.email,c.created_at])
  ];

  const content = rows.map(row =>
    row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')
  ).join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(
    new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'})
  );
  a.download = 'clients.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

}

async function vBanners(){const {data,error}=await sb.from('site_banners').select('*').eq('id',1).maybeSingle();if(error)return $('m').innerHTML='<h3>Большой фото-блок</h3><p>Сначала выполни SQL-файл sql/4_site_banners.sql в Supabase.</p><pre>'+esc(error.message)+'</pre>';const d=data||{};const photos=Array.isArray(d.photos)?d.photos:[];$('m').innerHTML='<h3>Большой фото-блок на главной</h3><p>Загрузи до 5 фотографий. Они будут автоматически перелистываться на сайте.</p><label>Заголовок<br><input id="bannerTitle" style="width:min(500px,95%)" value="'+esc(d.title||'Время для себя')+'"></label><br><br><label>Текст<br><textarea id="bannerSubtitle" style="width:min(500px,95%);height:70px">'+esc(d.subtitle||'Создайте свой ежедневный ритуал красоты')+'</textarea></label><h4>Фотографии ('+photos.length+'/5)</h4><div class="photo-stack">'+photos.map(u=>'<img src="'+esc(u)+'" style="width:100px;height:100px">').join('')+'</div><p><input id="bannerFiles" type="file" accept="image/*" multiple></p><button onclick="uploadBannerPhotos()">Загрузить выбранные фото</button> <button class="g" onclick="saveBannerText()">Сохранить заголовок и текст</button><p class="photo-help">При новой загрузке галерея заменяется выбранными фотографиями. Максимум 5.</p>';}
async function saveBannerText(){const payload={id:1,title:$('bannerTitle').value.trim(),subtitle:$('bannerSubtitle').value.trim()};const {error}=await sb.from('site_banners').upsert(payload,{onConflict:'id'});if(error)return alert('Не удалось сохранить: '+error.message);alert('Текст фото-блока сохранён.');await vBanners();}
async function uploadBannerPhotos(){const files=Array.from($('bannerFiles').files||[]);if(!files.length)return alert('Сначала выбери фотографии.');if(files.length>5)return alert('Можно загрузить максимум 5 фотографий.');if(files.some(f=>!f.type.startsWith('image/')))return alert('Выбери только изображения.');try{const urls=[];for(const file of files){const safe=file.name.replace(/[^\\w.-]/g,'_');const path='site-banner/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+safe;const {error}=await sb.storage.from('products').upload(path,file);if(error)throw error;urls.push(sb.storage.from('products').getPublicUrl(path).data.publicUrl);}const {error}=await sb.from('site_banners').upsert({id:1,title:$('bannerTitle').value.trim(),subtitle:$('bannerSubtitle').value.trim(),photos:urls},{onConflict:'id'});if(error)throw error;alert('Загружено '+urls.length+' фотографий.');await vBanners();}catch(e){alert('Ошибка загрузки: '+(e.message||e));}}
async function vPromos(){
  const {data,error} = await sb
    .from('promos')
    .select('*')
    .order('code');

  if(error) return $('m').textContent = error.message;

  $('m').innerHTML = `
    <h3>Промокоды</h3>
    <table>
      <tr><th>Код</th><th>Скидка, %</th><th>Активен</th><th></th></tr>
      ${(data||[]).map(c=>`
        <tr data-c="${esc(c.code)}">
          <td><b>${esc(c.code)}</b></td>
          <td><input type="number" name="percent" value="${esc(c.percent)}" style="width:70px"></td>
          <td><input type="checkbox" name="active"${c.active?' checked':''}></td>
          <td>
            <button onclick="savePr(this)">Сохранить</button>
            <button class="g" onclick="delPr(this)">Удалить</button>
          </td>
        </tr>
      `).join('')}
    </table>
    <h4>Новый промокод</h4>
    <input id="nc" placeholder="КОД">
    <input id="np" type="number" placeholder="%" style="width:70px">
    <button onclick="addPr()">Добавить</button>`;
}

async function savePr(b){
  const tr = b.closest('tr');
  const {error} = await sb.from('promos').update({
    percent:Number(tr.querySelector('[name=percent]').value),
    active:tr.querySelector('[name=active]').checked
  }).eq('code',tr.dataset.c);

  if(error) alert('Ошибка: '+error.message);
  else alert('Запрос выполнен. Проверь результат обновлением списка.');
}

async function delPr(b){
  if(!confirm('Удалить промокод?')) return;

  const {error} = await sb.from('promos')
    .delete()
    .eq('code',b.closest('tr').dataset.c);

  if(error) alert(error.message);
  else await vPromos();
}

async function addPr(){
  const code = $('nc').value.trim().toUpperCase();
  const percent = Number($('np').value);

  if(!code) return alert('Введи код промокода.');
  if(!Number.isFinite(percent) || percent<0 || percent>100){
    return alert('Укажи скидку от 0 до 100%.');
  }

  const {error} = await sb.from('promos').insert({code,percent});

  if(error) alert(error.message);
  else await vPromos();
}

if(!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY){
  showConfigError();
}else if(!window.supabase){
  $('app').textContent = 'Не удалось загрузить библиотеку Supabase. Обнови страницу.';
}else{
  sb = window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
  init();
}
</script>
</body>
</html>
