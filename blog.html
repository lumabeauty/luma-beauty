<!doctype html>
<html lang="ru"><head><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Блог о красоте и уходе — Luma Beauty</title><meta name="description" content="Советы по уходу за кожей и волосами, кудрявый метод, обзоры Dessi Cosmetica и Uazan."><link rel="canonical" href="https://lumabeauty.uz/blog.html"><link rel="icon" href="./favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<style>
:root{--bg:#fff8f1;--paper:#fffdf9;--ink:#38271f;--muted:#887466;--gold:#b88a4a;--line:#eadcc9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,Arial,sans-serif}a{color:inherit;text-decoration:none}.top{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.logo{font:600 30px 'Cormorant Garamond',serif;letter-spacing:.04em}.logo i{color:var(--gold)}.top nav{display:flex;gap:22px;font-size:14px}.hero{padding:70px 6% 48px;text-align:center;background:radial-gradient(ellipse at 50% 0,#f4e5d1,transparent 65%)}.eyebrow{letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-size:11px}.hero h1{font:600 clamp(42px,7vw,68px) 'Cormorant Garamond',serif;margin:10px 0}.hero p{color:var(--muted);max-width:600px;margin:auto;line-height:1.7}.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 70px}.filters{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:10px 0 30px}.filters button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 16px;border-radius:30px;cursor:pointer;font:inherit}.filters button.active{background:var(--ink);color:white;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 14px 35px #4b2d1712}.cover{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f1e6d8;display:block}.body{padding:20px}.cat{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}h2{font:600 27px 'Cormorant Garamond',serif;margin:8px 0}.excerpt{color:var(--muted);font-size:14px;line-height:1.65;min-height:48px}.read{display:inline-block;margin-top:12px;color:#9b713c;font-size:13px;font-weight:600}.empty{text-align:center;color:var(--muted);padding:50px 10px;grid-column:1/-1}footer{text-align:center;border-top:1px solid var(--line);padding:28px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.top nav{gap:12px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{padding:16px 5%}.top nav{font-size:12px}.hero{padding:48px 6%}}

.logo-img{display:block;height:46px;width:auto;max-width:none}
header .logo,.top .logo{display:inline-flex!important;align-items:center;line-height:0!important;font-size:0!important}
footer .logo{display:inline-block!important;line-height:0!important;font-size:0!important;margin:0 auto 12px}
footer .logo-img{height:62px;margin:0 auto}
@media(max-width:760px){header .logo-img,.top .logo-img{height:34px}footer .logo-img{height:52px}}
@media(max-width:380px){header .logo-img{height:30px}}
</style></head><body>
<header class="top"><a class="logo" href="index.html"><img class="logo-img" src="img/logo-luma.png" alt="Luma Beauty" width="116" height="48"></a><nav><a href="index.html">Магазин</a><a href="blog.html">Блог</a></nav></header>
<section class="hero"><div class="eyebrow">Luma Beauty journal</div><h1>Красота начинается с заботы</h1><p>Понятные советы по уходу за кожей и волосами, знакомство с брендами и полезные инструкции для вашей ежедневной рутины.</p></section>
<main class="wrap"><div class="filters" id="filters"></div><section class="grid" id="posts"><div class="empty">Загружаем статьи…</div></section></main><footer><a class="logo" href="index.html"><img class="logo-img" src="img/logo-luma.png" alt="Luma Beauty" width="116" height="48"></a>Красота в деталях</footer>
<script>
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);let all=[],active='Все статьи';
const cats=['Все статьи','Уход за кожей','Уход за волосами','Кудрявый метод','Dessi Cosmetica','Uazan'];
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function draw(){document.getElementById('filters').innerHTML=cats.map(c=>'<button class="'+(active===c?'active':'')+'" onclick="pick(\''+c+'\')">'+esc(c)+'</button>').join('');const rows=active==='Все статьи'?all:all.filter(p=>p.category===active);document.getElementById('posts').innerHTML=rows.length?rows.map(p=>'<a class="card" href="article.html?slug='+encodeURIComponent(p.slug)+'">'+(p.cover_image?'<img class="cover" src="'+esc(p.cover_image)+'" alt="'+esc(p.title)+'" loading="lazy">':'<div class="cover"></div>')+'<div class="body"><div class="cat">'+esc(p.category)+'</div><h2>'+esc(p.title)+'</h2><div class="excerpt">'+esc(p.excerpt)+'</div><span class="read">Читать статью →</span></div></a>').join(''):'<div class="empty">В этой категории пока нет опубликованных статей.</div>'}
function pick(c){active=c;draw()}
(async()=>{const {data,error}=await sb.from('blog_posts').select('id,slug,title,excerpt,category,cover_image,published_at').eq('published',true).order('published_at',{ascending:false});if(error){document.getElementById('posts').innerHTML='<div class="empty">Не удалось загрузить статьи. Попробуйте позже.</div>';return}all=data||[];draw()})();
</script><script src="i18n-data.js?v=5"></script><script src="i18n.js?v=5"></script>
</body></html>
