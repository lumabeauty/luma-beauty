}

function showPhoto(i){if(!photos.length)return;i=(i+photos.length)%photos.length;$('mainPhoto').src=photos[i];document.querySelectorAll('.thumb').forEach((b,n)=>b.classList.toggle('active',n===i));}
function addToCart(){location.href='index.html?add='+encodeURIComponent(product.id)+'&qty='+qty}
function toggleFavorite(){if(!product)return;let a=[];try{a=JSON.parse(localStorage.getItem('luma_favorites')||'[]')}catch(e){}const i=a.indexOf(String(product.id));if(i<0)a.push(String(product.id));else a.splice(i,1);localStorage.setItem('luma_favorites',JSON.stringify(a));$('favorite').textContent=i<0?'♥':'♡'}
function tab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));const d=$('descriptionText'),ing=$('ingredientsText'),suit=$('suitsText'),spec=$('specsText');if(name==='description')$('tabDescription').scrollIntoView({block:'nearest',behavior:'smooth'});else if(name==='ingredients')$('tabIngredients').scrollIntoView({block:'nearest',behavior:'smooth'});else if(name==='suits')$('tabSuits').scrollIntoView({block:'nearest',behavior:'smooth'});else $('tabSpecs').scrollIntoView({block:'nearest',behavior:'smooth'})}
function renderRelated(){if(!related.length)return '';return '<section class="related"><h2>Похожие товары</h2><div class="related-grid">'+related.map(p=>'<a class="rel-card" href="product.html?id='+encodeURIComponent(p.id)+'">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.title)+'">':'<div class="mainphoto"></div>')+'<div class="rname">'+esc(p.title)+'</div><div class="rprice">'+(p.price?(Number(p.discount_percent)>0?'<s class="oldprice">'+money(p.price)+'</s> ':'')+money(Math.round(p.price*(100-(Number(p.discount_percent)||0))/100)):'Цена по запросу')+'</div></a>').join('')+'</div></section>'}
async function load(){if(!id){$('content').textContent='Не указан товар. Вернитесь в каталог.';return}
const {data,error}=await sb.from('products').select('*').eq('id',id).eq('active',true).maybeSingle();
if(error||!data){$('content').textContent='Товар не найден или больше не доступен.';return}
product=data;$('crumbName').textContent=data.title;
photos=[data.image,...(Array.isArray(data.gallery)?data.gallery:[])].filter(Boolean).slice(0,5);setProductSEO(data,photos[0]||'');
let relq=sb.from('products').select('id,title,price,discount_percent,image,category').eq('active',true).neq('id',id).limit(6);if(data.category)relq=relq.eq('category',data.category);const rr=await relq;related=rr.data||[];
let fav=[];try{fav=JSON.parse(localStorage.getItem('luma_favorites')||'[]')}catch(e){}
const thumbs=photos.map((u,n)=>'<button class="thumb '+(n===0?'active':'')+'" onclick="showPhoto('+n+')" aria-label="Фото '+(n+1)+'"><img src="'+esc(u)+'" alt=""></button>').join('');
const photo=photos.length?'<img id="mainPhoto" src="'+esc(photos[0])+'" alt="'+esc(data.title)+'">':'<div class="placeholder">Luma Beauty</div>';
$('content').className='';
$('content').innerHTML='<section class="layout"><div class="gallery"><div class="thumbs">'+thumbs+'</div><div class="mainphoto">'+photo+'<button class="heart" id="favorite" onclick="toggleFavorite()" aria-label="В избранное">'+(fav.includes(String(data.id))?'♥':'♡')+'</button></div></div><div class="info"><span class="pill">'+esc(data.category||data.kind||'Luma Beauty')+'</span><h1 class="title">'+esc(data.title)+'</h1><p class="subtitle">'+esc(data.kind||data.volume||'Косметика и уход для вашей красоты')+'</p><div class="price-row"><strong class="price">'+(data.price?money(Math.round(data.price*(100-(Number(data.discount_percent)||0))/100)):'Цена по запросу')+'</strong>'+(Number(data.discount_percent)>0?'<s class="oldprice">'+money(data.price)+'</s><span class="discount">−'+Number(data.discount_percent)+'%</span>':'')+'</div><p class="desc">'+esc(data.description||data.kind||'Подробная информация о средстве и рекомендации по применению указаны на упаковке производителя.')+'</p><div class="buyrow"><div class="stepper"><button onclick="qty=Math.max(1,qty-1);$(\'qty\').textContent=qty">−</button><span id="qty">1</span><button onclick="qty=Math.min(99,qty+1);$(\'qty\').textContent=qty">+</button></div><button class="buy" onclick="addToCart()">🛒　В корзину</button><button class="favorite" onclick="toggleFavorite()" aria-label="В избранное">♡</button></div><div class="assurances"><div class="assurance"><b>◇</b><span>Оригинал<br>100%</span></div><div class="assurance"><b>▤</b><span>Быстрая<br>доставка</span></div><div class="assurance"><b>♧</b><span>Поддержка<br>24/7</span></div><div class="assurance"><b>♢</b><span>Безопасная<br>оплата</span></div></div></div></section><section class="details"><div class="tabs"><button class="tab active" data-tab="description" onclick="tab(\'description\')">Описание</button><button class="tab" data-tab="ingredients" onclick="tab(\'ingredients\')">Состав</button><button class="tab" data-tab="suits" onclick="tab(\'suits\')">Для кого?</button><button class="tab" data-tab="specs" onclick="tab(\'specs\')">Характеристики</button></div><div class="panels"><article class="panel" id="tabDescription"><h3>Описание</h3><p id="descriptionText">'+esc(data.description||data.kind||'Подробная информация о средстве указана на упаковке производителя.')+'</p></article><article class="panel" id="tabIngredients"><h3>Состав</h3><p id="ingredientsText">'+esc(data.ingredients||'Полный состав (INCI) указан на упаковке товара.')+'</p></article><article class="panel" id="tabSuits"><h3>Для кого?</h3><p id="suitsText">'+esc(data.suits||'Ориентируйтесь на назначение средства и информацию производителя на упаковке.')+'</p></article><article class="panel" id="tabSpecs"><h3>Характеристики</h3><p id="specsText">Категория: '+esc(data.category||'—')+'<br>Тип: '+esc(data.kind||'—')+'<br>Объём: '+esc(data.volume||'—')+'</p></article></div></section>'+renderRelated();
const {count}=await sb.from('products').select('id',{count:'exact',head:true}).eq('active',true);$('cartCount').textContent='0';
}
let touchStartX=0;document.addEventListener('touchstart',e=>{if(e.target.closest('.mainphoto'))touchStartX=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(!touchStartX||!e.target.closest('.mainphoto'))return;const dx=e.changedTouches[0].clientX-touchStartX;touchStartX=0;if(Math.abs(dx)>45&&photos.length>1){const active=[...document.querySelectorAll('.thumb')].findIndex(b=>b.classList.contains('active'));showPhoto(active+(dx<0?1:-1))}},{passive:true});
load();
</script>
</body></html>
