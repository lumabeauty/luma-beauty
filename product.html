.rv-b .stars{font-size:15px}.rv-b p{margin:8px 0 0;font-size:15px;line-height:1.55;color:#4a3a3f;white-space:pre-line;overflow-wrap:anywhere}
.rv-empty{color:#9b868c;text-align:center;padding:22px 0 6px}
.rv-mini{display:inline-flex;align-items:center;gap:8px;margin:2px 0 10px;color:#6f5b61;font-size:13.5px;text-decoration:none}.rv-mini .stars{font-size:16px}
@media(max-width:760px){.rv{padding:20px 16px;border-radius:20px;margin-top:30px}.rv-head h2{font-size:25px;margin-bottom:14px}.rv-top{grid-template-columns:1fr 1.4fr;gap:16px}.rv-act{grid-column:1/-1}.rv-avg{font-size:44px}}
</style>
</head>
<body>
<div class="topbar"><div class="perks"><span><b class="ico">▣</b> Доставка 35 000 сум по всему Узбекистану</span><span><b class="ico">♧</b> 100% оригинал</span><span><b class="ico">♧</b> Поддержка 24/7</span></div><div class="contacts"><a href="https://www.instagram.com/lumabeautyuz/" target="_blank" rel="noopener" aria-label="Instagram">◎</a><a href="tel:+998910010184">☎　+998 91 001 01 84</a></div></div>
<header class="head"><a class="brand" href="index.html"><img class="logo-img" src="img/logo-luma.png" alt="Luma Beauty" width="116" height="48"></a><nav class="nav"><a href="index.html">Главная</a><a href="index.html#catalog">Каталог⌄</a><a href="index.html#catalog">Новинки</a><a href="index.html#about">О нас</a><a href="index.html#delivery">Доставка</a><a href="index.html#contacts">Контакты</a></nav><div class="actions"><button aria-label="Поиск" onclick="location.href='index.html#catalog'">⌕</button><button aria-label="Профиль" onclick="location.href='index.html'">♙</button><button aria-label="Избранное" onclick="toggleFavorite()">♡</button><button aria-label="Корзина" onclick="location.href='index.html?cart=1'">🛒<span class="bubble" id="cartCount">0</span></button></div></header>
<main><div class="crumb"><a href="index.html">⌂ Главная</a>　›　<a href="index.html#catalog">Каталог</a>　›　<span id="crumbName">Товар</span></div><div id="content" class="notice">Загружаем информацию о товаре…</div></main>
<footer>© 2026 Luma Beauty. Красота. Уход. Вдохновение.</footer>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),id=params.get('id');
const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
let product=null,qty=1,photos=[],related=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('ru-RU').replace(/\u00a0|\u202f/g,' ')+' сум';
function setMeta(name,content,property=false){let el=document.head.querySelector((property?'meta[property="':'meta[name="')+name+'"]');if(!el){el=document.createElement('meta');el.setAttribute(property?'property':'name',name);document.head.appendChild(el)}el.setAttribute('content',content)}
function setProductSEO(p,photo){
 const title=p.title+' — купить в Luma Beauty, Узбекистан';
 const desc=[p.title,p.kind,p.volume,p.category,'цена '+(p.price?money(Math.round(p.price*(100-(Number(p.discount_percent)||0))/100)):'уточняйте'),'доставка по Узбекистану'].filter(Boolean).join('. ').slice(0,300);
 const url='https://lumabeauty.uz/product.html?id='+encodeURIComponent(p.id);
 document.title=title;
 setMeta('description',desc);
 let canonical=document.head.querySelector('link[rel="canonical"]');if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}canonical.href=url;
 setMeta('og:type','product',true);setMeta('og:title',title,true);setMeta('og:description',desc,true);setMeta('og:url',url,true);
 if(photo)setMeta('og:image',photo,true);
 setMeta('twitter:card','summary_large_image');setMeta('twitter:title',title);setMeta('twitter:description',desc);if(photo)setMeta('twitter:image',photo);
 const old=document.getElementById('product-jsonld');if(old)old.remove();
 const schema={'@context':'https://schema.org/','@type':'Product',name:p.title,description:desc,sku:String(p.id),url:url,brand:p.kind?{'@type':'Brand',name:p.kind}:undefined,image:photo?[photo]:undefined,category:p.category,offers:p.price?{'@type':'Offer',url:url,priceCurrency:'UZS',price:String(Math.round(p.price*(100-(Number(p.discount_percent)||0))/100)),availability:'https://schema.org/InStock',itemCondition:'https://schema.org/NewCondition',seller:{'@type':'Organization',name:'Luma Beauty'}}:undefined};
 const ld=document.createElement('script');ld.type='application/ld+json';ld.id='product-jsonld';ld.textContent=JSON.stringify(schema);document.head.appendChild(ld);
}

function showPhoto(i){if(!photos.length)return;i=(i+photos.length)%photos.length;$('mainPhoto').src=photos[i];document.querySelectorAll('.thumb').forEach((b,n)=>b.classList.toggle('active',n===i));}
function addToCart(){location.href='index.html?add='+encodeURIComponent(product.id)+'&qty='+qty}
function toggleFavorite(){if(!product)return;let a=[];try{a=JSON.parse(localStorage.getItem('luma_favorites')||'[]')}catch(e){}const i=a.indexOf(String(product.id));if(i<0)a.push(String(product.id));else a.splice(i,1);localStorage.setItem('luma_favorites',JSON.stringify(a));$('favorite').textContent=i<0?'♥':'♡'}
function tab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));const d=$('descriptionText'),ing=$('ingredientsText'),suit=$('suitsText'),spec=$('specsText');if(name==='description')$('tabDescription').scrollIntoView({block:'nearest',behavior:'smooth'});else if(name==='ingredients')$('tabIngredients').scrollIntoView({block:'nearest',behavior:'smooth'});else if(name==='suits')$('tabSuits').scrollIntoView({block:'nearest',behavior:'smooth'});else $('tabSpecs').scrollIntoView({block:'nearest',behavior:'smooth'})}
function renderRelated(){if(!related.length)return '';return '<section class="related"><h2>Похожие товары</h2><div class="related-grid">'+related.map(p=>'<a class="rel-card" href="product.html?id='+encodeURIComponent(p.id)+'">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.title)+'">':'<div class="mainphoto"></div>')+'<div class="rname">'+esc(p.title)+'</div><div class="rprice">'+(p.price?(Number(p.discount_percent)>0?'<s class="oldprice">'+money(p.price)+'</s> ':'')+money(Math.round(p.price*(100-(Number(p.discount_percent)||0))/100)):'Цена по запросу')+'</div></a>').join('')+'</div></section>'}
async function load(){if(!id){$('content').textContent='Не указан товар. Вернитесь в каталог.';return}
const {data,error}=await sb.from('products').select('*').eq('id',id).eq('active',true).maybeSingle();
if(error||!data){$('content').textContent='Товар не найден или больше не доступен.';return}
product=data;$('crumbName').textContent=data.title;
photos=[data.image,...(Array.isArray(data.gallery)?data.gallery:[])].filter(Boolean).slice(0,5);setProductSEO(data,photos[0]||'');
let relq=sb.from('products').select('id,title,price,discount_percent,image,category').eq('active',true).neq('id',id).limit(6);if(data.category)relq=relq.eq('category',data.category);const rr=await relq;related=rr.data||[];
let fav=[];try{fav=JSON.parse(localStorage.getItem('luma_favorites')||'[]')}catch(e){}
const thumbs=photos.map((u,n)=>'<button class="thumb '+(n===0?'active':'')+'" onclick="showPhoto('+n+')" aria-label="Фото '+(n+1)+'"><img src="'+esc(u)+'" alt=""></button>').join('');
const photo=photos.length?'<img id="mainPhoto" src="'+esc(photos[0])+'" alt="'+esc(data.title)+'">':'<div class="placeholder">Luma Beauty</div>';
$('content').className='';
$('content').innerHTML='<section class="layout"><div class="gallery"><div class="thumbs">'+thumbs+'</div><div class="mainphoto">'+photo+'<button class="heart" id="favorite" onclick="toggleFavorite()" aria-label="В избранное">'+(fav.includes(String(data.id))?'♥':'♡')+'</button></div></div><div class="info"><span class="pill">'+esc(data.category||data.kind||'Luma Beauty')+'</span><h1 class="title">'+esc(data.title)+'</h1><p class="subtitle">'+esc(data.kind||data.volume||'Косметика и уход для вашей красоты')+'</p><div class="price-row"><strong class="price">'+(data.price?money(Math.round(data.price*(100-(Number(data.discount_percent)||0))/100)):'Цена по запросу')+'</strong>'+(Number(data.discount_percent)>0?'<s class="oldprice">'+money(data.price)+'</s><span class="discount">−'+Number(data.discount_percent)+'%</span>':'')+'</div><p class="desc">'+esc(data.description||data.kind||'Подробная информация о средстве и рекомендации по применению указаны на упаковке производителя.')+'</p><div class="buyrow"><div class="stepper"><button onclick="qty=Math.max(1,qty-1);$(\'qty\').textContent=qty">−</button><span id="qty">1</span><button onclick="qty=Math.min(99,qty+1);$(\'qty\').textContent=qty">+</button></div><button class="buy" onclick="addToCart()">🛒　В корзину</button><button class="favorite" onclick="toggleFavorite()" aria-label="В избранное">♡</button></div><div class="assurances"><div class="assurance"><b>◇</b><span>Оригинал<br>100%</span></div><div class="assurance"><b>▤</b><span>Быстрая<br>доставка</span></div><div class="assurance"><b>♧</b><span>Поддержка<br>24/7</span></div><div class="assurance"><b>♢</b><span>Безопасная<br>оплата</span></div></div></div></section><section class="details"><div class="tabs"><button class="tab active" data-tab="description" onclick="tab(\'description\')">Описание</button><button class="tab" data-tab="ingredients" onclick="tab(\'ingredients\')">Состав</button><button class="tab" data-tab="suits" onclick="tab(\'suits\')">Для кого?</button><button class="tab" data-tab="specs" onclick="tab(\'specs\')">Характеристики</button></div><div class="panels"><article class="panel" id="tabDescription"><h3>Описание</h3><p id="descriptionText">'+esc(data.description||data.kind||'Подробная информация о средстве указана на упаковке производителя.')+'</p></article><article class="panel" id="tabIngredients"><h3>Состав</h3><p id="ingredientsText">'+esc(data.ingredients||'Полный состав (INCI) указан на упаковке товара.')+'</p></article><article class="panel" id="tabSuits"><h3>Для кого?</h3><p id="suitsText">'+esc(data.suits||'Ориентируйтесь на назначение средства и информацию производителя на упаковке.')+'</p></article><article class="panel" id="tabSpecs"><h3>Характеристики</h3><p id="specsText">Категория: '+esc(data.category||'—')+'<br>Тип: '+esc(data.kind||'—')+'<br>Объём: '+esc(data.volume||'—')+'</p></article></div></section>'+renderRelated();
const {count}=await sb.from('products').select('id',{count:'exact',head:true}).eq('active',true);$('cartCount').textContent='0';
}
let touchStartX=0;document.addEventListener('touchstart',e=>{if(e.target.closest('.mainphoto'))touchStartX=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(!touchStartX||!e.target.closest('.mainphoto'))return;const dx=e.changedTouches[0].clientX-touchStartX;touchStartX=0;if(Math.abs(dx)>45&&photos.length>1){const active=[...document.querySelectorAll('.thumb')].findIndex(b=>b.classList.contains('active'));showPhoto(active+(dx<0?1:-1))}},{passive:true});
load().then(()=>{if(product)loadReviews()});
document.addEventListener('luma:lang',()=>{if(product&&document.getElementById('reviews'))renderReviews()});
</script>
<script>
const STAR='<svg viewBox="0 0 24 24" width="1em" height="1em"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="currentColor"/></svg>';
function starsHTML(v){let h='';for(let i=1;i<=5;i++){const f=Math.max(0,Math.min(1,v-i+1));h+=`<span class="st"><span class="st-bg">${STAR}</span><span class="st-fg" style="width:${f*100}%">${STAR}</span></span>`}return `<span class="stars" aria-label="${v.toFixed(1)} из 5">${h}</span>`}
let RVL=[],myRev=null,canRev=false,rvUser=null,pick=0;
function rvWord(n){const a=n%10,b=n%100;return a==1&&b!=11?'отзыв':(a>=2&&a<=4&&(b<10||b>=20)?'отзыва':'отзывов')}
async function loadReviews(){
 const [{data:list},{data:{session}}]=await Promise.all([sb.from('product_reviews').select('id,rating,body,author_name,created_at,user_id,status').eq('product_id',product.id).order('created_at',{ascending:false}),sb.auth.getSession()]);
 rvUser=session?.user||null;RVL=(list||[]).filter(r=>r.status==='published');myRev=rvUser?(list||[]).find(r=>r.user_id===rvUser.id)||null:null;
 canRev=false;if(rvUser&&!myRev){const {data}=await sb.rpc('has_purchased',{p_product:product.id});canRev=!!data}
 renderReviews();
}
function renderReviews(){
 let box=document.getElementById('reviews');if(!box){box=document.createElement('section');box.id='reviews';box.className='rv';const rel=document.querySelector('#content .related');rel?rel.before(box):$('content').appendChild(box)}
 const n=RVL.length,avg=n?RVL.reduce((s,r)=>s+r.rating,0)/n:0;
 const dist=[5,4,3,2,1].map(x=>{const c=RVL.filter(r=>r.rating===x).length;return `<div class="rv-bar"><span>${x}</span><i><b style="width:${n?c/n*100:0}%"></b></i><em>${c}</em></div>`}).join('');
 let form='';
 if(!rvUser)form=`<div class="rv-note">Оставить отзыв могут покупатели этого товара. <a href="account.html">Войдите в аккаунт</a></div>`;
 else if(myRev)form=`<div class="rv-note">Спасибо, ваш отзыв опубликован${myRev.status==='hidden'?' (скрыт модератором)':''}. <button type="button" class="rv-link" onclick="editReview()">Изменить</button> · <button type="button" class="rv-link" onclick="deleteReview()">Удалить</button></div>`;
 else if(!canRev)form=`<div class="rv-note">Отзыв можно оставить после покупки этого товара — так все отзывы на Luma Beauty настоящие.</div>`;
 else form=reviewForm();
 box.innerHTML=`<div class="rv-head"><h2>Отзывы покупателей</h2></div><div class="rv-top"><div class="rv-sum">${n?`<div class="rv-avg">${avg.toFixed(1).replace('.',',')}</div>${starsHTML(avg)}<div class="rv-cnt">${n} ${rvWord(n)}</div>`:`<div class="rv-avg rv-0">—</div>${starsHTML(0)}<div class="rv-cnt">Пока нет отзывов</div>`}</div><div class="rv-dist">${dist}</div><div class="rv-act" id="rvAct">${form}</div></div><div class="rv-list">${n?RVL.map(r=>`<article class="rv-item"><div class="rv-ava">${esc((r.author_name||'П')[0])}</div><div class="rv-b"><div class="rv-meta"><b>${esc(r.author_name||'Покупатель')}</b><span class="rv-ok">✓ Покупка подтверждена</span><time>${new Date(r.created_at).toLocaleDateString(({en:'en-GB',uz:'uz-Latn-UZ',kk:'kk-KZ',ko:'ko-KR'})[window.LUMA_LANG]||'ru-RU',{day:'numeric',month:'long',year:'numeric'})}</time></div>${starsHTML(r.rating)}${r.body?`<p>${esc(r.body)}</p>`:''}</div></article>`).join(''):'<p class="rv-empty">Станьте первым, кто поделится впечатлением об этом товаре.</p>'}</div>`;
 if(n){const ld=document.getElementById('product-jsonld');if(ld){try{const o=JSON.parse(ld.textContent);o.aggregateRating={'@type':'AggregateRating',ratingValue:avg.toFixed(1),reviewCount:n};ld.textContent=JSON.stringify(o)}catch(e){}}}
 const sumEl=document.querySelector('.info .price-row');if(sumEl&&n&&!document.getElementById('rvMini')){sumEl.insertAdjacentHTML('beforebegin',`<a id="rvMini" class="rv-mini" href="#reviews">${starsHTML(avg)}<span>${avg.toFixed(1).replace('.',',')} · ${n} ${rvWord(n)}</span></a>`)}
}
function reviewForm(r){pick=r?r.rating:0;return `<form class="rv-form" onsubmit="saveReview(event)"><div class="rv-ft">${r?'Изменить отзыв':'Оцените товар'}</div><div class="rv-pick" id="rvPick">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}" onclick="setPick(${i})" aria-label="${i} из 5">${STAR}</button>`).join('')}</div><textarea id="rvBody" maxlength="1000" rows="4" placeholder="Что понравилось? Как подошло вашей коже или волосам?">${r?esc(r.body||''):''}</textarea><div class="rv-fb"><span id="rvErr" class="rv-err"></span><button type="submit" class="rv-send">${r?'Сохранить':'Опубликовать отзыв'}</button></div></form>`}
function setPick(v){pick=v;document.querySelectorAll('#rvPick button').forEach(b=>b.classList.toggle('on',+b.dataset.v<=v))}
function editReview(){$('rvAct').innerHTML=reviewForm(myRev);setPick(myRev.rating)}
async function saveReview(e){e.preventDefault();const err=$('rvErr');if(!pick){err.textContent='Выберите оценку от 1 до 5';return}const body=$('rvBody').value.trim().slice(0,1000)||null;const btn=e.target.querySelector('.rv-send');btn.disabled=true;
 const r=myRev?await sb.from('product_reviews').update({rating:pick,body}).eq('id',myRev.id):await sb.from('product_reviews').insert({product_id:product.id,rating:pick,body});
 btn.disabled=false;if(r.error){err.textContent='Не удалось сохранить отзыв. Попробуйте ещё раз.';return}loadReviews()}
async function deleteReview(){if(!myRev)return;const r=await sb.from('product_reviews').delete().eq('id',myRev.id);if(!r.error)loadReviews()}
</script>
<script src="i18n-data.js?v=8"></script><script src="i18n.js?v=8"></script>
