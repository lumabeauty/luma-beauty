const i=data.status==='canceled'?-1:ST.findIndex(s=>s[0]===data.status);
const d=new Date(data.created_at).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
document.getElementById('trR').innerHTML='<div class="lp-card2"><h2>Заказ №'+data.id+'</h2><p class="lp-mu">от '+d+' · '+data.items+' шт · '+money(data.total)+'</p>'+(i<0?'<p style="color:#c2366a;font-weight:600">❌ Заказ отменён</p>':'<div class="tr-steps">'+ST.map((s,k)=>'<div class="'+(k<=i?'on':'')+'"><em>'+s[2]+'</em><b>'+(k===3&&data.pickup?'Получен':s[1])+'</b></div>').join('')+'</div>')+'<p class="lp-mu">Вопросы по заказу? <a class="lp-link" href="https://t.me/'+((window.CFG&&CFG.TG_USER)||'lumabeautyuzz')+'" target="_blank" rel="noopener">Напишите нам в Telegram</a></p></div>'}
