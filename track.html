<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отследить заказ — Luma Beauty</title><meta name="description" content="Проверьте статус заказа Luma Beauty по номеру заказа и телефону."><link rel="canonical" href="https://lumabeauty.uz/track.html"><link rel="icon" href="./favicon.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta property="og:title" content="Отследить заказ — Luma Beauty"><meta property="og:description" content="Проверьте статус заказа Luma Beauty по номеру заказа и телефону."><meta property="og:type" content="website"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><link rel="stylesheet" href="luma-plus.css?v=4">
<style>body{margin:0;background:#fff7f8;color:#2a1e22;font-family:Jost,Arial,sans-serif}a{color:inherit}</style></head><body data-page="track">
<header class="lp-top"><a class="logo" href="index.html"><img class="logo-img" src="img/logo-luma.png" alt="Luma Beauty" width="116" height="48"></a><nav><a href="index.html">Магазин</a><a href="#" onclick="LP.openMega();return false">Каталог</a><a href="brands.html">Бренды</a><a href="offers.html">Акции</a><a href="gifts.html">Подарки</a><a href="blog.html">Блог</a></nav><div class="lp-acts actions"><a class="lp-hbtn" href="account.html" aria-label="Аккаунт">👤</a><a class="lp-hbtn" href="index.html#cart" aria-label="Корзина">🛍</a></div></header>
<section class="lp-hero"><small>Luma Beauty</small><h1>Отследить заказ</h1><p>Введите номер заказа и телефон, который указали при оформлении.</p></section>
<main class="lp-page" style="max-width:640px">
<form class="lp-card2" id="trF" onsubmit="track(event)"><label class="lp-mu">Номер заказа</label><input id="trN" inputmode="numeric" required placeholder="Например: 57" style="width:100%;box-sizing:border-box;border:1px solid #efdfe3;border-radius:12px;padding:13px;font:inherit;margin:6px 0 12px"><label class="lp-mu">Телефон</label><input id="trP" type="tel" required placeholder="+998 90 123 45 67" style="width:100%;box-sizing:border-box;border:1px solid #efdfe3;border-radius:12px;padding:13px;font:inherit;margin:6px 0 14px"><button class="lp-btn" style="width:100%">Проверить статус</button><p class="lp-mu" id="trM"></p></form>
<div id="trR"></div>
<p class="lp-mu" style="text-align:center">Все заказы также видны в <a class="lp-link" href="account.html">личном кабинете</a>.</p>
</main>
<footer class="lp-fallfoot">© 2026 Luma Beauty · Красота. Уход. Вдохновение. · <a href="tel:+998910010184">+998 91 001 01 84</a></footer>
<script>const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ru-RU').replace(/\u00a0|\u202f/g,' ')+' сум';</script>
<script src="luma-plus.js?v=3"></script>
<script>const ST=[['new','Заказ принят','📝'],['paid','Оплачен и собирается','💳'],['shipped','Передан в доставку','🚚'],['done','Доставлен','✅']];
const sp=new URLSearchParams(location.search);if(sp.get('n'))document.getElementById('trN').value=sp.get('n');
async function track(e){e.preventDefault();const n=parseInt(document.getElementById('trN').value.replace(/\D/g,'')),p=document.getElementById('trP').value,m=document.getElementById('trM');m.textContent='Ищем заказ…';
const {data,error}=await sb.rpc('track_order',{p_id:n,p_phone:p});
if(error||!data){m.textContent='Заказ не найден. Проверьте номер и телефон.';document.getElementById('trR').innerHTML='';return}m.textContent='';
const i=data.status==='canceled'?-1:ST.findIndex(s=>s[0]===data.status);
const d=new Date(data.created_at).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
document.getElementById('trR').innerHTML='<div class="lp-card2"><h2>Заказ №'+data.id+'</h2><p class="lp-mu">от '+d+' · '+data.items+' шт · '+money(data.total)+'</p>'+(i<0?'<p style="color:#c2366a;font-weight:600">❌ Заказ отменён</p>':'<div class="tr-steps">'+ST.map((s,k)=>'<div class="'+(k<=i?'on':'')+'"><em>'+s[2]+'</em><b>'+(k===3&&data.pickup?'Получен':s[1])+'</b></div>').join('')+'</div>')+'<p class="lp-mu">Вопросы по заказу? <a class="lp-link" href="https://t.me/'+((window.CFG&&CFG.TG_USER)||'lumabeautyuzz')+'" target="_blank" rel="noopener">Напишите нам в Telegram</a></p></div>'}
document.head.insertAdjacentHTML('beforeend','<style>.tr-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.tr-steps div{text-align:center;opacity:.4;position:relative}.tr-steps div.on{opacity:1}.tr-steps em{font-style:normal;display:grid;place-items:center;width:48px;height:48px;margin:0 auto 6px;border-radius:50%;background:#f6edef;font-size:22px}.tr-steps .on em{background:#e9faf8;box-shadow:0 0 0 2px #0a9e93}.tr-steps b{font-size:12.5px;font-weight:500}</style>');</script>
<script src="i18n-data.js?v=15"></script><script src="i18n.js?v=13"></script>
</body></html>
