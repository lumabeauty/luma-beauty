<!doctype html>
<html lang="ru"><head><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статья — Luma Beauty</title><meta name="description" content="Полезные советы о красоте и уходе от Luma Beauty."><link rel="icon" href="./favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><style>
:root{--bg:#fff8f1;--ink:#38271f;--muted:#887466;--gold:#b88a4a;--line:#eadcc9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,Arial,sans-serif}.top{padding:20px 6%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.logo{font:600 29px Georgia,serif;text-decoration:none;color:inherit}.logo i{color:var(--gold)}a{color:inherit}.wrap{max-width:820px;margin:42px auto;padding:0 22px 70px}.back{color:var(--gold);text-decoration:none;font-size:14px}.cat{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin-top:30px}h1{font:600 clamp(38px,7vw,58px) Georgia,serif;line-height:1.05;margin:14px 0 18px}.excerpt{font-size:18px;color:var(--muted);line-height:1.7}.cover{width:100%;max-height:480px;object-fit:cover;border-radius:16px;margin:24px 0}.content{font-size:17px;line-height:1.9;white-space:pre-wrap}.content h2{font:600 30px Georgia,serif}.shop{display:inline-block;margin-top:30px;padding:12px 20px;background:#38271f;color:white;text-decoration:none;border-radius:30px}footer{text-align:center;border-top:1px solid var(--line);padding:24px;color:var(--muted)}

.logo-img{display:block;height:46px;width:auto;max-width:none}
header .logo,.top .logo{display:inline-flex!important;align-items:center;line-height:0!important;font-size:0!important}
footer .logo{display:inline-block!important;line-height:0!important;font-size:0!important;margin:0 auto 12px}
footer .logo-img{height:62px;margin:0 auto}
@media(max-width:760px){header .logo-img,.top .logo-img{height:34px}footer .logo-img{height:52px}}
@media(max-width:380px){header .logo-img{height:30px}}
</style></head><body><header class="top"><a class="logo" href="index.html"><img class="logo-img" src="img/logo-luma.png" alt="Luma Beauty" width="116" height="48"></a><a href="blog.html">Все статьи</a></header><main class="wrap" id="article">Загружаем статью…</main><footer>Luma Beauty · Красота в деталях</footer>
<script>
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);const slug=new URLSearchParams(location.search).get('slug');function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
(async()=>{if(!slug){document.getElementById('article').textContent='Статья не найдена.';return}const {data,error}=await sb.from('blog_posts').select('*').eq('slug',slug).eq('published',true).maybeSingle();if(error||!data){document.getElementById('article').textContent='Статья не найдена или ещё не опубликована.';return}const title=data.seo_title||data.title,desc=data.seo_description||data.excerpt;document.title=title+' — Luma Beauty';document.querySelector('meta[name=description]').content=desc;let can=document.createElement('link');can.rel='canonical';can.href=location.origin+'/article.html?slug='+encodeURIComponent(data.slug);document.head.appendChild(can);const schema={'@context':'https://schema.org','@type':'Article','headline':data.title,'description':desc,'image':data.cover_image||undefined,'datePublished':data.published_at||data.created_at,'dateModified':data.updated_at,'publisher':{'@type':'Organization','name':'Luma Beauty','url':'https://lumabeauty.uz/'}};let ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify(schema);document.head.appendChild(ld);document.getElementById('article').innerHTML='<a class="back" href="blog.html">← Все статьи</a><div class="cat">'+esc(data.category)+'</div><h1>'+esc(data.title)+'</h1><p class="excerpt">'+esc(data.excerpt)+'</p>'+(data.cover_image?'<img class="cover" src="'+esc(data.cover_image)+'" alt="'+esc(data.title)+'">':'')+'<div class="content">'+esc(data.content)+'</div><a class="shop" href="index.html#catalog">Перейти в магазин</a>';})();
</script><script src="i18n-data.js?v=5"></script><script src="i18n.js?v=5"></script>
</body></html>
