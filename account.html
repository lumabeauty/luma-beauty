function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{ok(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('decode'))};im.src=u})}
function toBlob(c,type,q){return new Promise(r=>c.toBlob(r,type,q))}
async function avaUpload(file){if(!file)return;
 if(!/^image\//.test(file.type||'')&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name||''))return toast(t('Выберите изображение (JPG, PNG или WEBP)'));
 if(file.size>15*1024*1024)return toast(t('Файл слишком большой (до 15 МБ)'));
 S.avaBusy=true;render();
 try{
  const im=await loadImg(file),side=Math.min(im.naturalWidth,im.naturalHeight),N=Math.min(512,side)||512;
  const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.imageSmoothingQuality='high';
  x.drawImage(im,(im.naturalWidth-side)/2,(im.naturalHeight-side)/2,side,side,0,0,N,N);
  let blob=await toBlob(c,'image/webp',.88),ext='webp';
  if(!blob||blob.type!=='image/webp'){blob=await toBlob(c,'image/jpeg',.9);ext='jpg'}
  if(!blob)throw new Error('encode');
  const uid=S.session.user.id,path=uid+'/'+Date.now()+'.'+ext,old=S.profile.avatar_url||'';
  const up=await sb.storage.from('avatars').upload(path,blob,{contentType:blob.type,cacheControl:'31536000',upsert:false});if(up.error)throw up.error;
  const r=await sb.rpc('update_my_avatar',{p_path:path});if(r.error){await sb.storage.from('avatars').remove([path]);throw r.error}
  S.profile={...S.profile,avatar_url:path};
  if(old&&old!==path)sb.storage.from('avatars').remove([old]).catch(()=>{});
  S.avaBusy=false;render();toast(t('Фото обновлено'));
 }catch(e){console.warn(e);S.avaBusy=false;render();toast(t('Не удалось загрузить фото. Попробуйте ещё раз.'))}}
async function avaRemove(){const m=$('avaMenu');if(m)m.classList.remove('on');const old=S.profile&&S.profile.avatar_url;if(!old)return;
 S.avaBusy=true;render();
 const r=await sb.rpc('update_my_avatar',{p_path:''});S.avaBusy=false;
 if(r.error){console.warn(r.error);render();return toast(t('Не удалось сохранить. Попробуйте ещё раз.'))}
 S.profile={...S.profile,avatar_url:''};render();sb.storage.from('avatars').remove([old]).catch(()=>{});toast(t('Фото удалено'))}

 b+='<div class="meta">'+(o.payment?'<div><span>'+t('Оплата')+'</span><b>'+esc(t(PAY[o.payment]||o.payment))+'</b></div>':'')+(o.discount?'<div><span>'+t('Скидка')+'</span><b>'+esc(o.discount)+'%</b></div>':'')+(o.cashback_used?'<div><span>'+t('Оплачено кэшбэком')+'</span><b>−'+money(o.cashback_used)+'</b></div>':'')+(o.address?'<div><span>'+t('Доставка и время')+'</span><b class="addr">'+esc(o.address)+'</b></div>':'')+'<div><span>'+t('Итого')+'</span><b>'+money(o.total)+'</b></div></div>';
 return '<div class="ord'+(open?' open':'')+'" id="o'+o.id+'"><button class="ord-h" onclick="toggleO('+o.id+')" aria-expanded="'+open+'"><span><b>'+t('Заказ №')+esc(o.id)+'</b><small>'+esc(date(o.created_at))+' · '+n+' '+t('шт.')+'</small></span><span class="chip '+st[1]+'">'+esc(t(st[0]))+'</span><span style="display:flex;align-items:center;gap:10px"><span class="sum">'+money(o.total)+'</span>'+I.chev+'</span></button><div class="ord-b">'+b+'</div></div>'}
function toggleO(id){S.open[id]=!S.open[id];const e=$('o'+id);if(e){e.classList.toggle('open',S.open[id]);e.querySelector('.ord-h').setAttribute('aria-expanded',S.open[id])}}
function msg(id,text,ok){const e=$(id);if(e){e.textContent=text;e.className='msg '+(ok?'ok':'err')}}
async function saveName(){const v=$('nmIn').value.trim().replace(/\s+/g,' ');if(v.length<2||v.length>60)return msg('nmMsg',t('Введите имя от 2 до 60 символов'));
 $('nmBtn').disabled=true;const {data,error}=await sb.rpc('update_my_name',{p_name:v});if(error){console.warn(error);$('nmBtn').disabled=false;return msg('nmMsg',t(String(error.message).includes('invalid_name')?'Введите имя от 2 до 60 символов':'Не удалось сохранить. Попробуйте ещё раз.'))}
 S.profile={...S.profile,name:data||v};S.editName=false;render();toast(t('Имя сохранено'))}
async function savePass(){const a=$('pw1').value,b=$('pw2').value;if(a.length<6)return msg('pwMsg',t('Пароль должен быть не короче 6 символов'));if(a!==b)return msg('pwMsg',t('Пароли не совпадают'));
 $('pwBtn').disabled=true;const {error}=await sb.auth.updateUser({password:a});if(error){console.warn(error);$('pwBtn').disabled=false;const c=String(error.code||''),m=String(error.message||'').toLowerCase();return msg('pwMsg',t(c==='same_password'||m.includes('different from the old')?'Новый пароль совпадает со старым':c==='reauthentication_needed'||m.includes('reauthentic')?'Для смены пароля войдите заново':c==='weak_password'?'Пароль должен быть не короче 6 символов':'Не удалось сохранить. Попробуйте ещё раз.'))}
 S.editPass=false;render();toast(t('Пароль изменён'))}
async function logout(){await sb.auth.signOut();location.href='index.html'}

async function load(){
 const {data:{session}}=await sb.auth.getSession();S.session=session;S.ready=true;
 if(!session)return guest();
 try{
  const [pr,or]=await Promise.all([sb.from('profiles').select('name,phone,email,cashback_balance,cashback_percent,cashback_percent_override,avatar_url').eq('id',session.user.id).maybeSingle(),sb.from('orders').select('id,status,total,discount,cashback_used,payment,address,items,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false})]);
  if(pr.error)throw pr.error;S.profile=pr.data||{};S.orders=or.error?[]:(or.data||[]);
  const ids=[...new Set(S.orders.flatMap(o=>(Array.isArray(o.items)?o.items:[]).map(i=>i.id)).filter(Boolean))];
  render();
  if(ids.length){const {data}=await sb.from('products').select('id,title,image').in('id',ids);(data||[]).forEach(x=>S.products[x.id]=x);render()}
 }catch(e){console.warn(e);S.profile={};render();toast(t('Не удалось загрузить данные. Обновите страницу.'))}
}
sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'){S.session=null;guest()}});
acctSetLang(lang);load();
</script><script src="i18n-data.js?v=6"></script><script src="i18n.js?v=6"></script>
<script>(function(){const e=window.setLang;window.setLang=l=>{acctSetLang(l);e(l)};})();</script>
